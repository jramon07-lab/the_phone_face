name: Playwright regression

on:
  workflow_dispatch:
  push:
    branches:
      - candidato-final-validado-20260825

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify test secrets exist
        run: |
          test -n "$PLAYWRIGHT_BASE_URL"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
      - name: Run core Playwright smoke only
        run: npx playwright test tests/e2e/smoke.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

