name: Add System Status Panel

on:
  push:
    branches:
      - work/crm-unica-20260825
    paths:
      - .github/workflows/add-system-status-panel.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
      - name: Apply system status panel
        run: python scripts/add_system_status_panel.py
      - name: Commit panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/e2e/crm-system-status.spec.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Añade panel Estado del sistema para administrador"
            git push
          fi
