name: Split app core

on:
  push:
    branches:
      - work/crm-modular-20260826
    paths:
      - scripts/split_app_core.js

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-modular-20260826
      - run: node scripts/split_app_core.js
      - name: Commit physical split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/core js/modules/*-core.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Separa físicamente los módulos del CRM"
            git push origin HEAD:work/crm-modular-20260826
          fi
