name: Fix null onclick once

on:
  push:
    branches:
      - work/crm-unica-20260825
    paths:
      - .github/workflows/fix-null-onclick.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
          fetch-depth: 0
      - name: Patch null onclick handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''$("waAddTagSide").onclick=async()=>{\n  if(!waLiveState?.contact)return alert("Primero vincula el chat a un contacto.");\n  currentContact=waLiveState.contact;\n  await crmLoadLabels();\n  const assigned=await crmGetContactLabels(currentContact.id),ids=new Set(assigned.map(x=>x.id));\n  $("contactLabelsChoices").innerHTML=(crmLabelsCache||[]).map(x=>`<label class="contactLabelChoice"><input type="checkbox" value="${x.id}" ${ids.has(x.id)?"checked":""}><span>${esc(x.name)}</span></label>`).join("")||'<div class="small">No hay etiquetas. Créala primero en el menú Etiquetas.</div>';\n  $("contactLabelsModal").classList.remove("hidden");\n};\n$("waTagChat").onclick=$("waAddTagSide").onclick;'''
          new = '''const waAddTagSideEl=$("waAddTagSide");\nconst waTagChatEl=$("waTagChat");\nconst waOpenTagHandler=async()=>{\n  if(!waLiveState?.contact)return alert("Primero vincula el chat a un contacto.");\n  currentContact=waLiveState.contact;\n  await crmLoadLabels();\n  const assigned=await crmGetContactLabels(currentContact.id),ids=new Set(assigned.map(x=>x.id));\n  $("contactLabelsChoices").innerHTML=(crmLabelsCache||[]).map(x=>`<label class="contactLabelChoice"><input type="checkbox" value="${x.id}" ${ids.has(x.id)?"checked":""}><span>${esc(x.name)}</span></label>`).join("")||'<div class="small">No hay etiquetas. Créala primero en el menú Etiquetas.</div>';\n  $("contactLabelsModal").classList.remove("hidden");\n};\nif(waAddTagSideEl)waAddTagSideEl.onclick=waOpenTagHandler;\nif(waTagChatEl)waTagChatEl.onclick=waOpenTagHandler;'''
          if old not in s:
              raise SystemExit('Target block not found; refusing blind patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrige onclick nulo en etiquetas de WhatsApp"
          git push origin HEAD:work/crm-unica-20260825
