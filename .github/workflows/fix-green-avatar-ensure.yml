name: Fix GREEN avatar and ensure

on:
  push:
    branches: [work/crm-unica-20260825]
    paths:
      - '.github/workflows/fix-green-avatar-ensure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch GREEN-API fallbacks
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/green.js')
          s=p.read_text()

          old_avatar='''      const data = await greenFetch("getAvatar", {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify({ chatId })\n      });\n      return res.status(200).json({\n        ok: true,\n        chatId,\n        urlAvatar: data?.urlAvatar || "",\n        base64Avatar: data?.base64Avatar || "",\n        available: data?.available !== false,\n        data\n      });'''
          new_avatar='''      try {\n        const data = await greenFetch("getAvatar", {\n          method: "POST",\n          headers: { "Content-Type": "application/json" },\n          body: JSON.stringify({ chatId })\n        });\n        return res.status(200).json({\n          ok: true,\n          chatId,\n          urlAvatar: data?.urlAvatar || "",\n          base64Avatar: data?.base64Avatar || "",\n          available: data?.available !== false,\n          data\n        });\n      } catch (e) {\n        if (e?.status === 404 || e?.status === 429) {\n          return res.status(200).json({\n            ok: true,\n            chatId,\n            urlAvatar: "",\n            base64Avatar: "",\n            available: false,\n            degraded: true,\n            providerStatus: e.status\n          });\n        }\n        throw e;\n      }'''
          if old_avatar not in s:
              raise SystemExit('avatar block not found')
          s=s.replace(old_avatar,new_avatar,1)

          old_ensure='''    if (req.method === "POST" && action === "ensure") {\n      const current = await greenFetch("getSettings");\n      const needIncoming = String(current?.incomingWebhook || "").toLowerCase() !== "yes";'''
          new_ensure='''    if (req.method === "POST" && action === "ensure") {\n      let current;\n      try {\n        current = await greenFetch("getSettings");\n      } catch (e) {\n        if (e?.status === 404 || e?.status === 429) {\n          return res.status(200).json({\n            ok: true,\n            changed: false,\n            degraded: true,\n            providerStatus: e.status,\n            message: "GREEN-API no permitió comprobar ajustes temporalmente; se conserva la configuración actual."\n          });\n        }\n        throw e;\n      }\n      const needIncoming = String(current?.incomingWebhook || "").toLowerCase() !== "yes";'''
          if old_ensure not in s:
              raise SystemExit('ensure block not found')
          s=s.replace(old_ensure,new_ensure,1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/green.js
          git diff --cached --quiet && exit 0
          git commit -m 'Evita 502 no fatales en avatar y ensure GREEN-API'
          git push origin HEAD:work/crm-unica-20260825
