name: CRM modules check

on:
  push:
    branches:
      - main
      - work/crm-modular-20260826
      - tmp/contact-profile-recover-20260901
  pull_request:

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run offline regression suite
        run: npm run verify
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify scheduled WhatsApp saving on desktop and mobile with isolated fixtures
        run: npx playwright test --config=tests/e2e/schedule-save.config.cjs --reporter=line
      - name: Verify router templates on desktop and mobile with isolated fixtures
        run: npx playwright test --config=tests/e2e/router-return.config.js --workers=2 --retries=0 --reporter=line
      - name: Verify home management drawer with isolated fixtures
        run: npx playwright test --config=tests/e2e/home-manage.config.js --workers=2 --retries=0 --reporter=line
      - name: Verify installation communications with isolated fixtures
        run: npx playwright test --config=tests/e2e/installation-communications.config.js --workers=2 --retries=0 --reporter=line
      - name: Verify CRM module files and registrations
        shell: bash
        run: |
          set -euo pipefail
          files=(
            js/modules/runtime.js
            js/modules/whatsapp.js
            js/modules/agenda.js
            js/modules/contacts-sales.js
            js/modules/automations-settings.js
            js/modules/system-status.js
            js/modules/contact-profile.js
            js/modules/contact-activity-tabs.js
            js/modules/contact-opportunity-actions.js
            js/modules/contact-open-nonblocking.js
            js/modules/contact-actions-bridge.js
            js/modules/automations-auth-guard.js
            js/modules/whatsapp-read-guard.js
            js/modules/search-fallback.js
            js/modules/whatsapp-scheduling-core.js
            js/modules/automations-flow-builder.js
          )
          for f in "${files[@]}"; do test -s "$f" || { echo "Missing/empty: $f"; exit 1; }; done
          grep -q "M.register('contact-activity'" js/modules/contact-activity-tabs.js
          grep -q "M.register('contact-opportunities'" js/modules/contact-opportunity-actions.js
          grep -q "M.register('contact-open'" js/modules/contact-open-nonblocking.js
          grep -q "M.register('contact-edit'" js/modules/contact-actions-bridge.js
          grep -q "M.register('auth-guard'" js/modules/automations-auth-guard.js
          grep -q "M.register('whatsapp-read'" js/modules/whatsapp-read-guard.js
          grep -q "M.register('search'" js/modules/search-fallback.js
          grep -q "TPFAutomationFlow" js/modules/automations-flow-builder.js
          grep -q "openWhatsappProgramsView" js/modules/whatsapp-scheduling-core.js
          echo "CRM modular structure OK"
