name: Extract shell assets

on:
  push:
    branches:
      - work/crm-modular-20260826
    paths:
      - scripts/extract_shell_assets.js

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-modular-20260826
      - name: Extract CSS and inline JS
        run: node scripts/extract_shell_assets.js
      - name: Commit extracted shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/app.css js/app-core.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Extrae CSS y JS del index monolítico"
            git push origin HEAD:work/crm-modular-20260826
          fi
