name: Install modular runtime

on:
  push:
    branches:
      - work/crm-modular-20260826
    paths:
      - scripts/install_modular_runtime.py
      - js/modules/**
      - tests/e2e/crm-module-isolation.spec.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-modular-20260826
      - name: Install module script tags
        run: python scripts/install_modular_runtime.py
      - name: Commit HTML wiring if needed
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Conecta runtime modular aislado"
          git push origin HEAD:work/crm-modular-20260826
