name: Restore WhatsApp session auth

on:
  push:
    branches:
      - candidato-final-validado-20260825

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
      - name: Restore Supabase bearer for GREEN API
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''async function waApi(action,payload={}){
  const opts={headers:{"Content-Type":"application/json"}};'''
          new = '''async function waApi(action,payload={}){
  const opts={headers:{"Content-Type":"application/json"}};
  try{
    const {data}=await sb.auth.getSession();
    const token=data?.session?.access_token;
    if(token) opts.headers.Authorization="Bearer "+token;
  }catch(_){ }'''
          if old not in s:
              raise SystemExit('No se encontró waApi sin autenticación en index.html')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit WhatsApp auth repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore WhatsApp Supabase bearer"
          git push origin HEAD:candidato-final-validado-20260825
