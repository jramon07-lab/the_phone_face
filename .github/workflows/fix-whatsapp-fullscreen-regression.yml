name: Fix WhatsApp fullscreen regression

on:
  push:
    branches:
      - candidato-final-validado-20260825

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
      - name: Remove fullscreen takeover and internal labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the legacy fullscreen CSS/JS completely. WhatsApp already has
          # its own desktop three-column layout inside the CRM shell.
          s, css_n = re.subn(r'\s*<style id="wa-fullscreen-web-layout">.*?</style>\s*', '\n', s, count=1, flags=re.S)
          s, js_n = re.subn(r'\s*<script id="wa-fullscreen-web-js">.*?</script>\s*', '\n', s, count=1, flags=re.S)

          # If the earlier repair already replaced the JS block, this still removes it.
          if js_n != 1:
              raise SystemExit('No se encontró wa-fullscreen-web-js para retirar')
          if css_n != 1:
              raise SystemExit('No se encontró wa-fullscreen-web-layout para retirar')

          # Remove all leaked internal build/debug text from the user-facing subtitle.
          debug_patterns = [
              r'\s*<span[^>]*>\s*·?\s*V32\s+TAREA\s+ESTRUCTURA\s+NUEVA\s*</span>',
              r'\s*<span[^>]*>\s*·?\s*V22\s+VOLVER\s+OPORTUNIDADES\s+REBIND\s*</span>',
              r'\s*<span[^>]*>\s*·?\s*V17\s+CONSOLIDADA\s+AUDITADA\s*</span>',
              r'\s*<span[^>]*>\s*HÍBRIDA\s+v8\s+FULLSCREEN\s+·\s+OPORTUNIDADES\s+v6\s+SIMPLE\s*</span>',
          ]
          for pat in debug_patterns:
              s = re.sub(pat, '', s, flags=re.I)

          # Ensure no runtime path can re-add the fullscreen class.
          if 'classList.add("wa-fullscreen-mode")' in s or "classList.add('wa-fullscreen-mode')" in s:
              raise SystemExit('Queda una activación de wa-fullscreen-mode fuera del bloque retirado')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove WhatsApp fullscreen takeover"
          git push origin HEAD:candidato-final-validado-20260825
