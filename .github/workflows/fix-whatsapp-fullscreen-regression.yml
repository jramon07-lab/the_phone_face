name: Fix WhatsApp fullscreen regression

on:
  push:
    branches:
      - candidato-final-validado-20260825

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
      - name: Repair CRM shell and remove debug labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # WhatsApp must remain inside the CRM shell. The old helper hid sidebar/topbar.
          s, n = re.subn(
              r'<script id="wa-fullscreen-web-js">.*?</script>',
              '''<script id="wa-fullscreen-web-js">\n(function(){\n  function disableWhatsAppFullscreen(){\n    document.body.classList.remove("wa-fullscreen-mode");\n  }\n  disableWhatsAppFullscreen();\n  document.addEventListener("DOMContentLoaded", disableWhatsAppFullscreen);\n  document.addEventListener("click", function(){ setTimeout(disableWhatsAppFullscreen, 0); }, true);\n  window.addEventListener("pageshow", disableWhatsAppFullscreen);\n})();\n</script>''',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('No se encontró el bloque wa-fullscreen-web-js esperado')

          # Remove internal build/debug badges that leaked into the user interface.
          s = re.sub(r'\s*<span style="font-size:9px;font-weight:900;color:#c62828">· V32 TAREA ESTRUCTURA NUEVA</span>', '', s)
          s = re.sub(r'\s*<span style="font-size:9px;font-weight:900;color:#c62828">· V22 VOLVER OPORTUNIDADES REBIND</span>', '', s)
          s = re.sub(r'\s*<span style="font-size:9px;font-weight:900;color:#c62828">· V17 CONSOLIDADA AUDITADA</span>', '', s)
          s = re.sub(r'\s*<span style="font-size:9px;color:#6b7780;font-weight:800">HÍBRIDA v8 FULLSCREEN · OPORTUNIDADES v6 SIMPLE</span>', '', s)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep WhatsApp inside CRM shell"
          git push origin HEAD:candidato-final-validado-20260825
