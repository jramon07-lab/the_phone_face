name: Apply direct index origin fixes

on:
  push:
    branches:
      - candidato-final-validado-20260825
    paths:
      - .github/workflows/fix-index-origin.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
          fetch-depth: 0

      - name: Move remaining late modal block before binding script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          bind = '$("goalModalClose").onclick=()=>$("goalModal").classList.add("hidden");'
          start_marker = '<div id="goalModal"'
          end_marker = '<script id="tpf-v15-back-audit">'

          if bind not in html:
              raise SystemExit('No se encontró el binding de goalModalClose')
          if start_marker not in html:
              raise SystemExit('No se encontró goalModal')
          if end_marker not in html:
              raise SystemExit('No se encontró tpf-v15-back-audit')

          bind_pos = html.index(bind)
          script_pos = html.rfind('<script', 0, bind_pos)
          start = html.index(start_marker)
          end = html.index(end_marker, start)

          if script_pos < 0:
              raise SystemExit('No se encontró el script de bindings')

          if start > script_pos:
              block = html[start:end]
              html = html[:start] + html[end:]
              bind_pos = html.index(bind)
              script_pos = html.rfind('<script', 0, bind_pos)
              html = html[:script_pos] + block + '\n' + html[script_pos:]

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify late modal order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('index.html').read_text(encoding='utf-8')
          checks = [
            ('goalModal', 'goalModalClose'),
            ('contactLabelsModal', 'contactLabelsClose')
          ]
          for modal_id, close_id in checks:
              modal_pos = h.index(f'id="{modal_id}"')
              bind_token = f'$("{close_id}").onclick'
              bind_pos = h.index(bind_token)
              assert modal_pos < bind_pos, (modal_id, modal_pos, bind_pos)
              assert h.count(f'id="{modal_id}"') == 1
              assert h.count(f'id="{close_id}"') == 1
          print('Late modal blocks are available before bindings execute')
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: place late modals before their bindings"
          git push origin HEAD:candidato-final-validado-20260825
