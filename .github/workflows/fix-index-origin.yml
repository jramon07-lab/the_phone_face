name: Apply direct index origin fixes

on:
  push:
    branches:
      - candidato-final-validado-20260825
    paths:
      - .github/workflows/fix-index-origin.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
          fetch-depth: 0

      - name: Patch index.html at source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          guard = '''<script id="tpf-browser-compat-origin-v1">
          (function () {
            try {
              var storage = navigator.storage;
              if (!storage) {
                Object.defineProperty(navigator, "storage", {
                  configurable: true,
                  value: {}
                });
                storage = navigator.storage;
              }
              if (typeof storage.persisted !== "function") {
                Object.defineProperty(storage, "persisted", {
                  configurable: true,
                  value: function () { return Promise.resolve(false); }
                });
              }
              if (typeof storage.persist !== "function") {
                Object.defineProperty(storage, "persist", {
                  configurable: true,
                  value: function () { return Promise.resolve(false); }
                });
              }
            } catch (_) {}
          })();
          </script>'''

          if 'tpf-browser-compat-origin-v1' not in html:
              needle = '<head>'
              if needle not in html:
                  raise SystemExit('No se encontró <head>')
              html = html.replace(needle, needle + '\n' + guard, 1)

          duplicate = '''function waLoadTemplates(){
            return Array.isArray(waTemplatesCache) && waTemplatesCache.length
              ? waTemplatesCache
              : waDefaultTemplates();
          }'''

          count = html.count(duplicate)
          if count != 1:
              raise SystemExit(f'Se esperaba exactamente 1 bloque waLoadTemplates duplicado; encontrados: {count}')
          html = html.replace(duplicate, '/* TPF: eliminado waLoadTemplates duplicado que provocaba TDZ */', 1)

          if 'let waTemplatesCache = waLoadTemplates();' not in html:
              raise SystemExit('No se encontró el inicializador esperado de waTemplatesCache')
          if 'tpf-browser-compat-origin-v1' not in html:
              raise SystemExit('No se insertó el guard de compatibilidad')
          if duplicate in html:
              raise SystemExit('El bloque duplicado sigue presente')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify direct fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('index.html').read_text(encoding='utf-8')
          assert 'tpf-browser-compat-origin-v1' in h
          assert h.index('tpf-browser-compat-origin-v1') < h.index('cdn.jsdelivr.net/npm/@supabase/supabase-js@2')
          assert 'let waTemplatesCache = waLoadTemplates();' in h
          bad = '''function waLoadTemplates(){
            return Array.isArray(waTemplatesCache) && waTemplatesCache.length
              ? waTemplatesCache
              : waDefaultTemplates();
          }'''
          assert bad not in h
          print('Direct index fixes verified')
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: resolve template TDZ and iPhone storage at source"
          git push origin HEAD:candidato-final-validado-20260825
