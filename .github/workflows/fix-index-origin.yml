name: Apply direct index origin fixes

on:
  push:
    branches:
      - candidato-final-validado-20260825
    paths:
      - .github/workflows/fix-index-origin.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidato-final-validado-20260825
          fetch-depth: 0

      - name: Move contact labels modal before its binding script
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          modal = '''<div id="contactLabelsModal" class="waTemplateBack hidden">
            <div class="waTemplateCard">
              <div class="waTemplateHead"><h3>Etiquetas del contacto</h3><button id="contactLabelsClose" class="secondary">← Volver</button></div>
              <div id="contactLabelsChoices" class="contactLabelsChoices"></div>
              <div class="waTemplateActions"><button id="contactLabelsSave" class="primary">Guardar etiquetas</button></div>
            </div>
          </div>'''

          bind = '$("contactLabelsClose").onclick=()=>$("contactLabelsModal").classList.add("hidden");'

          if html.count(modal) != 1:
              raise SystemExit(f'Se esperaba 1 modal de etiquetas; encontrados: {html.count(modal)}')
          if bind not in html:
              raise SystemExit('No se encontró el binding de contactLabelsClose')

          bind_pos = html.index(bind)
          script_pos = html.rfind('<script', 0, bind_pos)
          modal_pos = html.index(modal)

          if script_pos < 0:
              raise SystemExit('No se encontró el script que enlaza el modal')

          if modal_pos > script_pos:
              html = html.replace(modal, '', 1)
              bind_pos = html.index(bind)
              script_pos = html.rfind('<script', 0, bind_pos)
              html = html[:script_pos] + modal + '\n\n' + html[script_pos:]

          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify contact labels modal order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('index.html').read_text(encoding='utf-8')
          modal_pos = h.index('<div id="contactLabelsModal"')
          bind_pos = h.index('$("contactLabelsClose").onclick=()=>$("contactLabelsModal").classList.add("hidden");')
          assert modal_pos < bind_pos
          assert h.count('id="contactLabelsModal"') == 1
          assert h.count('id="contactLabelsClose"') == 1
          assert h.count('id="contactLabelsSave"') == 1
          print('Contact labels modal is available before bindings execute')
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: bind contact labels after modal exists"
          git push origin HEAD:candidato-final-validado-20260825
