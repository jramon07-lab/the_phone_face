name: CRM protected two-PC validation
on:
  push:
    branches: ['perf/isolated-1200-20260912']
    paths: ['tests/e2e/crm-whatsapp-multidevice.spec.js', '.github/workflows/crm-sync-laboratory.yml', 'js/modules/whatsapp-*.js']
permissions:
  contents: read
concurrency:
  group: crm-browser-shared-test-account
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Compare scheduled target and stable target
        env:
          CONFIGURED_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
        run: node -e 'console.log("SCHEDULED_TARGET",new URL(process.env.CONFIGURED_BASE_URL).origin)'
      - name: Protected two-PC checks
        env:
          PLAYWRIGHT_BASE_URL: https://the-phone-face-app-whatsapp-fotos-y.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/crm-whatsapp-multidevice.spec.js --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-protected-two-pc-evidence
          path: |
            playwright-report
            test-results
