name: Fix GREEN transient retries

on:
  push:
    branches:
      - work/crm-unica-20260825
    paths:
      - .github/workflows/fix-green-transient-retries.yml
      - .github/scripts/patch-green-retries.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
      - name: Apply safe GREEN-API retry patch
        run: python .github/scripts/patch-green-retries.py
      - name: Commit retry protection
        run: |
          if git diff --quiet -- api/green.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- api/green.js
          git commit -m "Blinda GREEN-API ante 5xx transitorios"
          git push origin HEAD:work/crm-unica-20260825
