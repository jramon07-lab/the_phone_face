name: CRM Six Controls

on:
  workflow_dispatch:
  push:
    branches:
      - work/crm-unica-20260825

jobs:
  six-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: |
          npm install
          npm install --no-save @percy/cli @percy/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate six-control secrets
        env:
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          test -n "$CRM_TEST_EMAIL" || (echo "Missing CRM_TEST_EMAIL" && exit 1)
          test -n "$CRM_TEST_PASSWORD" || (echo "Missing CRM_TEST_PASSWORD" && exit 1)
          test -n "$PERCY_TOKEN" || (echo "Missing PERCY_TOKEN" && exit 1)
          test -n "$BROWSERSTACK_USERNAME" || (echo "Missing BROWSERSTACK_USERNAME" && exit 1)
          test -n "$BROWSERSTACK_ACCESS_KEY" || (echo "Missing BROWSERSTACK_ACCESS_KEY" && exit 1)

      - name: Start exact branch preview
        run: |
          node scripts/local-preview.js > /tmp/tpf-preview.log 2>&1 &
          echo $! > /tmp/tpf-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tpf-preview.log
          exit 1

      - name: Control 1 - Playwright real browser
        id: playwright
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: local-branch-preview
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/crm-visual.spec.js

      - name: Control 2 - Screenshot evidence
        id: screenshots
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: local-branch-preview
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/crm-screenshots.spec.js

      - name: Control 3 - Percy visual regression
        id: percy
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: local-branch-preview
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}
        run: npx percy exec -- npx playwright test tests/e2e/percy.spec.js

      - name: BrowserStack environment
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          build-name: crm-${{ github.sha }}
          project-name: The Phone Face CRM

      - name: Start BrowserStack Local
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: start
          local-identifier: random

      - name: Control 4 - BrowserStack real cloud browser
        id: browserstack
        continue-on-error: true
        env:
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: node scripts/browserstack-check.js

      - name: Stop BrowserStack Local
        if: always()
        uses: browserstack/github-actions/setup-local@master
        with:
          local-testing: stop

      - name: Control 5 - Smoke health and JavaScript
        id: smoke
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: local-branch-preview
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: |
          curl -fsS http://127.0.0.1:3000/healthz
          npx playwright test tests/e2e/crm-smoke.spec.js

      - name: Control 6 - Functional and permissions
        id: functional
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          VERCEL_AUTOMATION_BYPASS_SECRET: local-branch-preview
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
        run: npx playwright test tests/e2e/crm-functional.spec.js

      - name: Six-control matrix
        if: always()
        run: |
          echo "Control 1 Playwright: ${{ steps.playwright.outcome }}"
          echo "Control 2 Screenshots: ${{ steps.screenshots.outcome }}"
          echo "Control 3 Percy: ${{ steps.percy.outcome }}"
          echo "Control 4 BrowserStack: ${{ steps.browserstack.outcome }}"
          echo "Control 5 Smoke/JS: ${{ steps.smoke.outcome }}"
          echo "Control 6 Functional/permissions: ${{ steps.functional.outcome }}"
          test "${{ steps.playwright.outcome }}" = success
          test "${{ steps.screenshots.outcome }}" = success
          test "${{ steps.percy.outcome }}" = success
          test "${{ steps.browserstack.outcome }}" = success
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.functional.outcome }}" = success

      - name: Upload all evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-six-controls-evidence
          path: |
            playwright-report
            test-results
            /tmp/tpf-preview.log
          if-no-files-found: ignore
