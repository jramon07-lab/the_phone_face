name: Instrument GREEN errors
on:
  push:
    branches: [work/crm-unica-20260825]
    paths:
      - .github/workflows/instrument-green-errors.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
      - name: Add safe GREEN diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/green.js')
          s=p.read_text()
          old='''  } catch (e) {\n    return res.status(502).json({\n      ok: false,\n      error: e?.message || String(e),\n      greenMethod: e?.greenMethod || null,\n      greenStatus: e?.status || null\n    });\n  }\n}'''
          new='''  } catch (e) {\n    const failedAction = String(req.query.action || "").toLowerCase();\n    console.error("GREEN_API_ERROR", {\n      action: failedAction,\n      requestMethod: req.method,\n      greenMethod: e?.greenMethod || null,\n      greenStatus: e?.status || null,\n      message: e?.message || String(e)\n    });\n    return res.status(502).json({\n      ok: false,\n      error: e?.message || String(e),\n      action: failedAction,\n      greenMethod: e?.greenMethod || null,\n      greenStatus: e?.status || null\n    });\n  }\n}'''
          if 'GREEN_API_ERROR' not in s:
              if old not in s:
                  raise SystemExit('catch block not found')
              p.write_text(s.replace(old,new))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/green.js
          git diff --cached --quiet || git commit -m "Registra acción exacta de errores GREEN-API"
          git push origin HEAD:work/crm-unica-20260825
