name: CRM Live Integrations Audit
on:
  workflow_dispatch:
  push:
    branches: [desarrollo-crm]
    paths:
      - tests/e2e/audit-live-integrations.spec.js
      - .github/workflows/live-integrations-audit.yml
permissions:
  contents: read
  actions: read
jobs:
  browser_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the same commit to pass the official browser gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-browser-gate.cjs
  audit:
    needs: browser_gate
    # Queue only after the official gate finishes. A workflow-wide concurrency
    # slot would replace a pending browser gate and could cancel this audit.
    concurrency:
      group: crm-browser-shared-test-account
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify real archive and synthetic document lifecycle
        env:
          VERCEL_PREVIEW_URL: https://the-phone-face-app-whatsapp-git-a7bebf-jramon-07-2402s-projects.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CRM_TEST_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_TEST_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
          E2E_EXPECTED_COMMIT: ${{ github.sha }}
          E2E_AUDIT_ID: ${{ github.run_id }}
        run: npx playwright test tests/e2e/audit-live-integrations.spec.js --workers=1 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-live-integrations-audit
          path: playwright-report
