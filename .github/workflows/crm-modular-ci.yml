name: CRM Modular CI

on:
  workflow_dispatch:
  push:
    branches:
      - work/crm-modular-20260826
      - tmp/contact-profile-recover-20260901

permissions:
  contents: read

concurrency:
  group: crm-modular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Critical modular structure guard
        run: node scripts/modular-guard.js

      - name: Validate JavaScript syntax
        run: |
          node -c api/index.js
          node -c api/index-clean.js
          node -c api/index-fix.js
          node -c js/modules/system-status.js
