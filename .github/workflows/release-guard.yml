name: CRM Release Guard

on:
  push:
    branches:
      - work/crm-unica-20260825
  pull_request:

jobs:
  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Comprobar estructura crítica del CRM
        run: node scripts/release-guard.js
