name: Fix GREEN API status codes

on:
  push:
    branches:
      - work/crm-unica-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-unica-20260825
      - name: Map provider 4xx without turning them into 502
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/green.js')
          s=p.read_text()
          old='''    return res.status(502).json({\n      ok: false,\n      error: e?.message || String(e),\n      action: failedAction,\n      greenMethod: e?.greenMethod || null,\n      greenStatus: e?.status || null\n    });'''
          new='''    const providerStatus = Number(e?.status || 0);\n    const responseStatus = providerStatus >= 400 && providerStatus < 500 ? providerStatus : 502;\n    return res.status(responseStatus).json({\n      ok: false,\n      error: e?.message || String(e),\n      action: failedAction,\n      greenMethod: e?.greenMethod || null,\n      greenStatus: e?.status || null\n    });'''
          if old not in s:
              print('Patch already applied or target changed')
          else:
              p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- api/green.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/green.js
          git commit -m 'Devuelve 4xx reales sin convertirlos en 502'
          git push
