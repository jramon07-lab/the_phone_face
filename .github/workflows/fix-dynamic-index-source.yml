name: Fix dynamic index source

on:
  push:
    branches:
      - work/crm-modular-20260826
    paths:
      - scripts/fix_dynamic_index_source.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/crm-modular-20260826
      - run: python scripts/fix_dynamic_index_source.py
      - name: Commit dynamic source fix
        run: |
          if git diff --quiet -- api/index.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index.js
          git commit -m "Sirve el HTML del commit desplegado"
          git push origin HEAD:work/crm-modular-20260826
