name: Parallel apply CRM fixes

on:
  push:
    branches:
      - prueba-paralela-whatsapp-etiquetas-backups-20260825

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prueba-paralela-whatsapp-etiquetas-backups-20260825
      - name: Apply backup UI patch
        run: python .github/scripts/patch_parallel_backups.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore backups on parallel preview"
          git push origin HEAD:prueba-paralela-whatsapp-etiquetas-backups-20260825
